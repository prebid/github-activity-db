name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests: a new push supersedes the previous run. Pushes to main: one group per
  # commit, so no run on main is cancelled or replaced and every commit keeps a verdict.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.7.10"
          python-version: "3.13"
      - name: uv.lock matches pyproject.toml
        run: uv lock --locked
      - name: Install project and dev tools from uv.lock
        run: uv sync --frozen --extra dev
      - name: pre-commit (ruff, mypy, file checks, quality gates)
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: Hydration and schema version lock entries are kept
        if: github.event_name == 'pull_request'
        # Compares with the base commit the merge ref was built on, its first parent. The base
        # commit's copy of the checker runs, isolated from the pull request's environment
        # (-I -S), so editing scripts/check_query_lock.py cannot relax this check; the pull
        # request's copy runs only where the base has none. The workflow file itself comes from
        # the pull request, so this step guards against mistakes, not against edits to it.
        run: |
          parents=$(git cat-file -p HEAD | sed -n 's/^parent //p')
          test "$(echo "$parents" | wc -l)" -eq 2
          base=$(echo "$parents" | head -n 1)
          git fetch --no-tags --depth=1 origin "$base"
          checker=scripts/check_query_lock.py
          if git cat-file -e "$base:$checker" 2>/dev/null; then
            git show "$base:$checker" > "$RUNNER_TEMP/check_query_lock.py"
            checker="$RUNNER_TEMP/check_query_lock.py"
          fi
          echo "base $base; running $checker"
          uv run --no-sync python -I -S "$checker" --base "$base"

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.7.10"
          python-version: ${{ matrix.python-version }}
      - name: Install project and dev tools from uv.lock
        run: uv sync --frozen --extra dev
      # The migration tests depend on SQLite's behavior; record which build they ran on.
      - name: Python and SQLite versions
        run: uv run --no-sync python -c "import sqlite3, sys; print(sys.version, sqlite3.sqlite_version)"
      - name: pytest
        env:
          PYTHONHASHSEED: "1"
        run: uv run --no-sync pytest --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Require an executed, passing test run with no skips
        run: uv run --no-sync python scripts/check_junit.py "$RUNNER_TEMP/junit.xml" --max-skipped 0
      # D40: the same outcome in another run order and under another hash seed. Each pair of tests
      # runs in the other order; a dependence shows only where it changes an outcome.
      - name: pytest again, last to first, under another hash seed
        id: reversed
        env:
          PYTHONHASHSEED: "2"
        run: uv run --no-sync pytest --reverse-order --junitxml="$RUNNER_TEMP/junit-reversed.xml"
      # Also after a failing reversed run, so each test whose outcome differs is named.
      - name: Require the two runs to agree test by test
        if: ${{ !cancelled() && steps.reversed.outcome != 'skipped' }}
        run: |
          uv run --no-sync python scripts/check_junit.py "$RUNNER_TEMP/junit.xml" --max-skipped 0 \
            --same-as "$RUNNER_TEMP/junit-reversed.xml"
      - name: Migrations upgrade a fresh database and match the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/migrations.db
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check

  wheel:
    name: built wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.7.10"
          python-version: "3.13"
      - name: Build the wheel with hash-checked build dependencies
        run: |
          uv build --wheel --build-constraints build-constraints.txt --require-hashes \
            --out-dir "$RUNNER_TEMP/dist"
      - name: Install the wheel with the locked dependencies into a new environment
        run: |
          uv export --frozen --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" --require-hashes \
            -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" --no-deps \
            "$RUNNER_TEMP"/dist/*.whl
          uv pip check --python "$RUNNER_TEMP/wheel-env/bin/python"
      - name: Run the installed package from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" \
            "$GITHUB_WORKSPACE/src/github_activity_db/tracking.toml" "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/wheel-env/bin/ghactivity" --help
