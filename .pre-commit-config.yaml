# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# ruff and mypy run from the project environment so local runs and CI use the versions
# pinned in uv.lock. Hooks never modify the environment (`--no-sync`); create it first with
# `uv sync --frozen --extra dev`, then install the hooks with `uv run pre-commit install`.

repos:
  # ------------------------------------------------------------------------------
  # General hooks
  # ------------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key

  # ------------------------------------------------------------------------------
  # Lint, format, and type check from uv.lock
  # ------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src tests scripts
        language: system
        pass_filenames: false
        files: ^(src|tests|scripts)/

  # ------------------------------------------------------------------------------
  # Quality gates
  # ------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: suppression-caps
        name: type:ignore (max 5) and noqa (max 3) comments in src/
        entry: uv run --no-sync python scripts/count_suppressions.py src --max-type-ignore 5 --max-noqa 3
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: prevent-any-aliases
        name: Prevent new Any type aliases
        entry: >
          bash -c 'if grep -rn "^[A-Z][a-zA-Z]* = Any" src/ 2>/dev/null | grep -v "^Binary";
          then echo "Found type alias to Any - use TYPE_CHECKING block instead"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true
