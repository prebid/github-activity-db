# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# ruff and mypy run from the project environment so local runs and CI use the versions
# pinned in uv.lock. Hooks never modify the environment (`--no-sync`); create it first with
# `uv sync --frozen --extra dev`, then install the hooks with `uv run pre-commit install`.

repos:
  # ------------------------------------------------------------------------------
  # General hooks
  # ------------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # --enforce-all checks every file, not only newly added ones, so the hook also works
      # in CI (`pre-commit run --all-files`). github_activity.db stays exempt while it is
      # tracked in git (redesign plan Step 6 moves it out).
      - id: check-added-large-files
        args: ["--maxkb=1000", "--enforce-all"]
        exclude: ^github_activity\.db$
      - id: check-merge-conflict
      - id: detect-private-key

  # ------------------------------------------------------------------------------
  # Lint, format, and type check from uv.lock
  # ------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src tests scripts
        language: system
        pass_filenames: false
        files: ^(src|tests|scripts)/

  # ------------------------------------------------------------------------------
  # Quality gates
  # ------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: suppression-caps
        name: type:ignore (max 5) and noqa (max 3) comments in src/
        entry: uv run --no-sync python scripts/count_suppressions.py src --max-type-ignore 5 --max-noqa 3
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: tracked-db-rollback-journal
        name: github_activity.db in rollback-journal mode (D20)
        entry: uv run --no-sync python scripts/check_db_journal.py
        language: system
        files: ^github_activity\.db$

      - id: tracked-db-frozen
        name: github_activity.db keeps its pinned pre-Step-3 content (D26)
        entry: uv run --no-sync python scripts/check_frozen_db.py
        language: system
        files: ^github_activity\.db$

      # A journal, WAL, or shared-memory file beside the database changes what SQLite reads
      # from it, past the pinned digest, the next time the database is opened.
      - id: tracked-db-no-sidecar
        name: no journal, WAL, or shared-memory file of github_activity.db in git (D20, D26)
        entry: remove it from git; SQLite would apply it to github_activity.db on the next open
        language: fail
        files: ^github_activity\.db-(journal|wal|shm)$

      - id: prevent-any-aliases
        name: Prevent new Any type aliases
        entry: uv run --no-sync python scripts/check_any_aliases.py src
        language: system
        pass_filenames: false
        always_run: true

      - id: log-placeholders
        name: loguru messages use {} placeholders, not %
        entry: uv run --no-sync python scripts/check_log_placeholders.py src
        language: system
        pass_filenames: false
        always_run: true
